# Visitor song: notes and lyric lines that visitors add through the "visitor-note" issue template.
# Every night it reads open issues with the visitor-note label, adds accepted notes and lines to data/visitor-song.json,
# rebuilds the lyrics and the card, pushes, asks the profile-cards workflow to publish the new MP3 to Pages,
# then comments on each issue with the second its part plays and closes it.
# When the lyrics change, ACE-Step 1.5 sings a new take (scripts/visitor_take.py): first on acemusic.ai with the
# ACESTEP_API_KEY secret (skipped if it isn't set), then on this runner's CPU, and if both fail the last good take stays.

name: Visitor song

on:
  schedule:
    - cron: "15 18 * * *"  # 23:45 IST, just before the profile cards
  workflow_dispatch:
  push:
    branches: [main]
    # a new poster design is uploaded for visitors who don't have one yet; a change to the singing makes a new take
    paths: ["scripts/visitor_poster.py", "scripts/visitor_take.py", ".github/workflows/visitor-song.yml"]

concurrency:
  group: visitor-song
  cancel-in-progress: false

jobs:
  visitor-song:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}  # optional; only raises Hugging Face download limits
      HF_HUB_VERBOSITY: error
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r scripts/requirements.txt

      - name: Read new notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/visitor_song.py --no-audio

      # ---- a new sung take when the lyrics changed: cloud, then CPU, else keep the last good take ----
      - name: Does the song need a new take?
        id: take
        run: python scripts/visitor_take.py --check >> "$GITHUB_OUTPUT"

      - name: Install the singing tools
        if: steps.take.outputs.needed == 'true'
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          pip install --quiet torch==2.10.0 torchaudio==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet demucs==4.1.0 faster-whisper==1.2.1 soundfile torchcodec

      # restore and save are separate so the models are kept even when a later step fails
      - name: Restore Whisper and Demucs
        id: tools
        if: steps.take.outputs.needed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface/hub/models--Systran--faster-whisper-small.en
            ~/.cache/torch/hub/checkpoints
          key: visitor-take-tools-v1

      - name: Sing on acemusic.ai
        id: cloud
        if: steps.take.outputs.needed == 'true'
        continue-on-error: true
        env:
          ACESTEP_API_KEY: ${{ secrets.ACESTEP_API_KEY }}
        run: python scripts/visitor_take.py --cloud /tmp/take

      - name: Get ACE-Step for the CPU
        if: steps.take.outputs.needed == 'true' && steps.cloud.outcome != 'success'
        run: |
          git clone --quiet https://github.com/ace-step/ACE-Step-1.5 ~/ace-step
          git -C ~/ace-step checkout --quiet ca1e85fe9430179831e6bc6be790c332190a3866

      - name: Restore the ACE-Step models
        id: acemodels
        if: steps.take.outputs.needed == 'true' && steps.cloud.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: ~/ace-step/checkpoints
          key: ace-step-v15-turbo-bf16-lm06-ca1e85f

      - name: Sing on the CPU
        id: cpu
        if: steps.take.outputs.needed == 'true' && steps.cloud.outcome != 'success'
        continue-on-error: true
        env:
          ACE_STEP_DIR: /home/runner/ace-step
          VISITOR_TAKE_TRIES: "3"
        run: |
          pip install --quiet "transformers>=4.51.0,<4.58.0" "diffusers>=0.37.0" einops accelerate loguru diskcache numba \
            vector-quantize-pytorch "torchao>=0.16.0,<0.17.0" toml peft modelscope matplotlib huggingface_hub safetensors pytorch_wavelets PyWavelets
          python scripts/visitor_take.py --prepare-cpu
          echo "prepared=true" >> "$GITHUB_OUTPUT"  # only complete models get cached
          python scripts/visitor_take.py --cpu /tmp/take

      - name: Save Whisper and Demucs
        if: always() && steps.take.outputs.needed == 'true' && steps.tools.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/huggingface/hub/models--Systran--faster-whisper-small.en
            ~/.cache/torch/hub/checkpoints
          key: visitor-take-tools-v1

      - name: Save the ACE-Step models
        if: always() && steps.cpu.outputs.prepared == 'true' && steps.acemodels.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/ace-step/checkpoints
          key: ace-step-v15-turbo-bf16-lm06-ca1e85f

      - name: Why this take
        if: always() && steps.take.outputs.needed == 'true'
        run: |
          if [ "${{ steps.cloud.outcome }}" = success ]; then echo "::notice::acemusic.ai sang the take"
          elif [ "${{ steps.cpu.outcome }}" = success ]; then echo "::notice::The cloud didn't give a good take (see the 'Sing on acemusic.ai' warnings), so the CPU sang it"
          else echo "::warning::Neither the cloud nor the CPU gave a good take, so the last good take stays"; fi

      # Only a take that passed the checks is uploaded; otherwise the release keeps the last good one.
      - name: Publish the take
        if: steps.cloud.outcome == 'success' || steps.cpu.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s /tmp/take/visitor-take.mp3 && test -s /tmp/take/visitor-take.json
          gh release view visitor-song >/dev/null 2>&1 || gh release create visitor-song --title "Visitor song video" \
            --notes "The visitor song and its lyric video, rebuilt as visitors add lines." --latest=false
          gh release upload visitor-song /tmp/take/visitor-take.mp3 /tmp/take/visitor-take.json --clobber
          python - <<'PY'
          import json; t = json.load(open("/tmp/take/visitor-take.json"))
          print(f"::notice::Visitor song sung by {t['engine']}: {t['accuracy_mix']:.0%} of words heard, voice {t['balance_db']['after']:+.1f} dB over the music, {t['lufs']} LUFS")
          PY

      - name: Lyrics and timings from the take
        if: steps.cloud.outcome == 'success' || steps.cpu.outcome == 'success'
        env:
          VISITOR_TAKE_DIR: /tmp/take
        run: python scripts/visitor_song.py --rebuild --no-audio

      - name: Commit changes
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="assets/visitor-song-dark.svg assets/visitor-song-light.svg assets/visitor-song-lyrics.md
                 assets/visitor-song.lrc assets/visitor-song.json data/visitor-song.json"
          # These files are generated, so a rebase conflict is never worth resolving: if main moved,
          # start again from the new main and read the notes once more.
          for i in 1 2 3; do
            git add $files
            if git diff --cached --quiet; then
              echo "No changes"
              if [ "${{ steps.cloud.outcome }}" = success ] || [ "${{ steps.cpu.outcome }}" = success ]; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"  # a new take still needs publishing
              fi
              exit 0
            fi
            git commit --quiet -m "Update visitor song"
            if git push --quiet; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python scripts/visitor_song.py --no-audio
            done
          exit 1

      # The player site is built and deployed by the profile-cards workflow; run it now so the new notes are live.
      - name: Publish the song
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run profile-cards.yml --ref main

      # Share posters go on "visitor-posters-<n>" releases, not in the repo; only visitors without one get a new one.
      - name: Visitor posters
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/visitor_poster.py /tmp/visitor-posters --release

      - name: Reply to visitors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/visitor_song.py --reply
          git add data/visitor-song.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Mark visitor notes as answered"
          for i in 1 2 3; do
            git pull --rebase --quiet -X theirs && git push && exit 0
            sleep 10
          done
          exit 1
