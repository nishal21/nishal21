# Visitor song: notes and lyric lines that visitors add through the "visitor-note" issue template.
# Every night it reads open issues with the visitor-note label, adds accepted notes and lines to data/visitor-song.json,
# rebuilds the lyrics and the card, pushes, asks the profile-cards workflow to publish the new MP3 to Pages,
# then comments on each issue with the second its part plays and closes it. Uses only the built-in GITHUB_TOKEN.

name: Visitor song

on:
  schedule:
    - cron: "15 18 * * *"  # 23:45 IST, just before the profile cards
  workflow_dispatch:

concurrency:
  group: visitor-song
  cancel-in-progress: false

jobs:
  visitor-song:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r scripts/requirements.txt

      - name: Read new notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/visitor_song.py --no-audio
          python scripts/visitor_poster.py assets/visitor-posters --missing || echo "posters not made"

      - name: Commit changes
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="assets/visitor-song-dark.svg assets/visitor-song-light.svg assets/visitor-song-lyrics.md
                 assets/visitor-song.lrc assets/visitor-song.json data/visitor-song.json assets/visitor-posters"
          # These files are generated, so a rebase conflict is never worth resolving: if main moved,
          # start again from the new main and read the notes once more.
          for i in 1 2 3; do
            git add $files
            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi
            git commit --quiet -m "Update visitor song"
            if git push --quiet; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python scripts/visitor_song.py --no-audio
            python scripts/visitor_poster.py assets/visitor-posters --missing || echo "posters not made"
          done
          exit 1

      # The player site is built and deployed by the profile-cards workflow; run it now so the new notes are live.
      - name: Publish the song
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run profile-cards.yml --ref main

      - name: Reply to visitors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/visitor_song.py --reply
          git add data/visitor-song.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Mark visitor notes as answered"
          for i in 1 2 3; do
            git pull --rebase --quiet -X theirs && git push && exit 0
            sleep 10
          done
          exit 1
