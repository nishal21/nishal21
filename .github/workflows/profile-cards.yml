# Profile cards and the contribution song.
# Cards: what I'm building, recent commits, latest YouTube upload, last 12 months, contribution song.
# The song MP3, its player page and the video page (/video/) are published to GitHub Pages (https://nishal21.github.io/nishal21/player/)
# instead of being committed, so the repo doesn't grow by 1.5 MB every night.
# Each generator runs on its own; if one fails, its previous image stays in place and Pages keeps the last song.
# Uses the built-in GITHUB_TOKEN and public endpoints; ACESTEP_API_KEY (optional) lets acemusic.ai sing the song.
# One-time setting: Settings > Pages > Build and deployment > Source: GitHub Actions.

name: Profile cards

on:
  schedule:
    - cron: "30 18 * * *"  # 00:00 IST every night
  workflow_dispatch:
    inputs:
      deapi_test:
        description: "Only make a deAPI test song (an artifact, nothing goes live)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "player/**"
      - "video/**"
      - "scripts/**"
      - "data/visitor-song.json"
      - "assets/visitor-song-base-lyrics.md"
      - ".github/workflows/profile-cards.yml"

concurrency:
  group: profile-cards-piper
  cancel-in-progress: false

jobs:
  # A test song from deAPI, uploaded as an artifact. Nothing is committed, released or deployed.
  deapi-test:
    if: ${{ inputs.deapi_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install dependencies
        run: |
          pip install --quiet -r scripts/requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
          pip install --quiet torch==2.10.0 torchaudio==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet demucs==4.1.0 faster-whisper==1.2.1 soundfile torchcodec
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/piper-voices
          key: piper-voices-ryan-high-libritts_r-medium-v5
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/song-data
          key: song-data-${{ github.run_id }}
          restore-keys: song-data-
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface/hub/models--Systran--faster-whisper-small.en
            ~/.cache/torch/hub/checkpoints
          key: visitor-take-tools-v1
      - name: Sing it on deAPI and build the song
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEAPI_API_KEY: ${{ secrets.DEAPI_API_KEY }}
          CONTRIB_LINES_OUT: /tmp/contribution-lines.json
          TAKE_LINES: /tmp/contribution-lines.json
        run: |
          mkdir -p /tmp/out
          CONTRIB_NO_TAKE=1 python scripts/contribution_song.py
          DEAPI_TRIES=6 DEAPI_SAVE_BEST=/tmp/cbest python scripts/visitor_take.py --contribution --deapi /tmp/ctake | tee /tmp/out/deapi-log.txt || true
          [ -s /tmp/ctake/contribution-take.json ] || { mkdir -p /tmp/ctake; cp /tmp/cbest/* /tmp/ctake/ 2>/dev/null || true; }
          cp /tmp/ctake/contribution-take.mp3 /tmp/out/deapi-best-take.mp3 2>/dev/null || true
          if [ -s /tmp/ctake/contribution-take.json ]; then
            CONTRIB_TAKE_DIR=/tmp/ctake python scripts/contribution_song.py || true
            cp assets/contribution-song.mp3 /tmp/out/deapi-song.mp3
            python scripts/visitor_take.py --contribution --check-song /tmp/out/deapi-song.mp3 | tee -a /tmp/out/deapi-log.txt || true
          fi
          cp /tmp/ctake/contribution-take.* /tmp/out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deapi-test
          path: /tmp/out

  cards:
    if: ${{ !inputs.deapi_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 120  # ACE-Step can take an hour on the CPU when the lyrics change and the cloud is busy
    permissions:
      contents: write
    env:
      CONTRIB_NO_TAKE: "1"  # ACE-Step off for the contribution song: Piper sings, nothing is sung on the runner
    outputs:
      song: ${{ steps.song.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install --quiet -r scripts/requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)

      - name: Cache the Piper voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper-voices
          key: piper-voices-ryan-high-libritts_r-medium-v5

      - name: Restore the song data cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/song-data
          key: song-data-${{ github.run_id }}
          restore-keys: song-data-

      - name: Last 12 months
        continue-on-error: true
        run: python scripts/year_card.py

      - name: All time
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/alltime_card.py

      - name: What I'm building and recent commits
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_tracker.py

      - name: Latest YouTube upload
        continue-on-error: true
        run: python scripts/youtube_card.py

      - name: Video library
        continue-on-error: true
        run: python scripts/youtube_videos.py

      - name: Summary cards (hours and languages)
        continue-on-error: true
        run: bash scripts/summary_cards.sh

      - name: Check the lyric templates
        continue-on-error: true
        run: python scripts/test_song_lyrics.py

      - name: Contribution song
        id: song
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIB_LINES_OUT: /tmp/contribution-lines.json
        run: python scripts/contribution_song.py

      # ACE-Step sings the lyrics a section at a time (acemusic.ai first, the CPU for any section it can't sing well),
      # every section Whisper-checked; the song is rendered again on its own beat grid with the stitched voice.
      # Without a take that passes, the Piper vocals rendered above stay.
      - name: Does the song need a new take?
        id: take
        if: steps.song.outcome == 'success' && env.CONTRIB_NO_TAKE != '1'
        continue-on-error: true
        env:
          TAKE_LINES: /tmp/contribution-lines.json
        run: python scripts/visitor_take.py --contribution --check >> "$GITHUB_OUTPUT"

      - name: Install the singing tools
        if: steps.take.outputs.needed == 'true'
        run: |
          pip install --quiet torch==2.10.0 torchaudio==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet demucs==4.1.0 faster-whisper==1.2.1 soundfile torchcodec

      - name: Restore Whisper and Demucs
        id: tools
        if: steps.take.outputs.needed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface/hub/models--Systran--faster-whisper-small.en
            ~/.cache/torch/hub/checkpoints
          key: visitor-take-tools-v1

      - name: Get ACE-Step for the CPU
        if: steps.take.outputs.needed == 'true'
        run: |
          git clone --quiet https://github.com/ace-step/ACE-Step-1.5 ~/ace-step
          git -C ~/ace-step checkout --quiet ca1e85fe9430179831e6bc6be790c332190a3866

      - name: Restore the ACE-Step models
        id: acemodels
        if: steps.take.outputs.needed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/ace-step/checkpoints
          key: ace-step-v15-turbo-bf16-lm06-ca1e85f

      # sections that passed are kept, so a rerun only sings the ones that didn't (and lines whose numbers changed)
      - name: Restore the sung sections
        if: steps.take.outputs.needed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ctake/sections
          key: contribution-sections-${{ github.run_id }}
          restore-keys: contribution-sections-

      # deAPI (hosted ACE-Step, paid from credit) sings the whole song in one job, only when the lyrics changed.
      - name: Sing the contribution song on deAPI
        id: deapi
        if: steps.take.outputs.needed == 'true'
        continue-on-error: true
        env:
          DEAPI_API_KEY: ${{ secrets.DEAPI_API_KEY }}
          DEAPI_TRIES: "4"
          TAKE_LINES: /tmp/contribution-lines.json
        run: python scripts/visitor_take.py --contribution --deapi /tmp/ctake

      - name: Sing the contribution song
        id: sing
        if: steps.take.outputs.needed == 'true' && steps.deapi.outcome != 'success'
        continue-on-error: true
        env:
          ACESTEP_API_KEY: ${{ secrets.ACESTEP_API_KEY }}
          ACE_STEP_DIR: /home/runner/ace-step
          TAKE_LINES: /tmp/contribution-lines.json
          VISITOR_TAKE_TRIES: "3"
        run: |
          pip install --quiet "transformers>=4.51.0,<4.58.0" "diffusers>=0.37.0" einops accelerate loguru diskcache numba \
            vector-quantize-pytorch "torchao>=0.16.0,<0.17.0" toml peft modelscope matplotlib huggingface_hub safetensors pytorch_wavelets PyWavelets
          python scripts/visitor_take.py --prepare-cpu
          echo "prepared=true" >> "$GITHUB_OUTPUT"  # only complete models get cached
          python scripts/visitor_take.py --contribution --sections /tmp/ctake

      - name: Save the sung sections
        if: always() && steps.take.outputs.needed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /tmp/ctake/sections
          key: contribution-sections-${{ github.run_id }}

      - name: Save Whisper and Demucs
        if: always() && steps.take.outputs.needed == 'true' && steps.tools.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/huggingface/hub/models--Systran--faster-whisper-small.en
            ~/.cache/torch/hub/checkpoints
          key: visitor-take-tools-v1

      - name: Save the ACE-Step models
        if: always() && steps.sing.outputs.prepared == 'true' && steps.acemodels.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/ace-step/checkpoints
          key: ace-step-v15-turbo-bf16-lm06-ca1e85f

      - name: Publish the take
        if: steps.sing.outcome == 'success' || steps.deapi.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s /tmp/ctake/contribution-take-vocals.wav && test -s /tmp/ctake/contribution-take.json
          gh release view contribution-song-take >/dev/null 2>&1 || gh release create contribution-song-take \
            --title "Contribution song take" --notes "The ACE-Step vocal take for the contribution song." --latest=false
          gh release upload contribution-song-take /tmp/ctake/contribution-take.mp3 /tmp/ctake/contribution-take.json \
            /tmp/ctake/contribution-take-vocals.wav --clobber
          python -c "import json; t = json.load(open('/tmp/ctake/contribution-take.json')); print(f\"::notice::Contribution song sung by {t['engine']}: {t['accuracy_voice']:.0%} of words heard\")"

      - name: Contribution song with the take
        if: steps.sing.outcome == 'success' || steps.deapi.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIB_TAKE_DIR: /tmp/ctake
        run: python scripts/contribution_song.py

      # The final song is checked the way a listener hears it: Demucs pulls the voice out of the mixed MP3 and Whisper
      # must hear the lyrics. If it doesn't, the song is rendered again with the Piper vocals.
      - name: Check the song's vocals
        if: steps.song.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAKE_LINES: /tmp/contribution-lines.json
        run: |
          if python -c "import json,sys; sys.exit(json.load(open('assets/contribution-song.json')).get('engine', 'Piper') != 'Piper')"; then
            echo "Piper sings tonight, nothing to check"; exit 0
          fi
          python -c "import demucs, faster_whisper" 2>/dev/null || {
            pip install --quiet torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet demucs==4.1.0 faster-whisper==1.2.1 soundfile torchcodec; }
          if ! python scripts/visitor_take.py --contribution --check-song assets/contribution-song.mp3; then
            echo "::warning::The ACE-Step song didn't pass the listening check, so Piper sings tonight"
            CONTRIB_NO_TAKE=1 python scripts/contribution_song.py
          fi

      - name: Visitor song
        continue-on-error: true
        run: python scripts/visitor_song.py --rebuild

      - name: Year trailer card
        if: steps.song.outcome == 'success'
        continue-on-error: true
        run: python scripts/year_trailer.py poster

      - name: Commit changes
        continue-on-error: true  # a lost race to push must not stop the site from deploying
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update profile cards"
          # other workflows (blog posts, activity) also commit to this branch, so retry on a race
          for i in 1 2 3; do
            # the files here are generated, so on a conflict this run's copy wins
            git pull --rebase --quiet -X theirs || { git rebase --abort; false; } && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Build the player site
        if: steps.song.outcome == 'success'
        run: bash scripts/build_site.sh

      - name: Upload the site
        if: steps.song.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The visitor song's lyric video as an MP4 for downloading and sharing. It goes on a rolling "visitor-song"
      # release (the file is replaced every night) instead of the repo or the Pages site, which play it live.
      - name: Visitor video release
        if: steps.song.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/visitor_video.py /tmp/visitor-video
          gh release view visitor-song >/dev/null 2>&1 || gh release create visitor-song --title "Visitor song video" \
            --notes "The visitor song's lyric video, rebuilt every night as visitors add lines. Watch it live: https://nishal21.github.io/nishal21/video/?v=visitor" --latest=false
          gh release upload visitor-song /tmp/visitor-video/visitor-song.mp4 --clobber

  pages:
    needs: cards
    if: always() && needs.cards.outputs.song == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}player/
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
