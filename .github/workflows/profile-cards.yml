# Profile cards: commit beat (SVG + MP3), what I'm building, recent commits,
# latest YouTube upload and the last-12-months card. All images are written to assets/.
# Each generator runs on its own; if one fails, its previous image stays in place.
# Uses only the built-in GITHUB_TOKEN and public endpoints. No extra secrets.

name: Profile cards

on:
  schedule:
    - cron: "30 18 * * *"  # 00:00 IST every night
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet -r scripts/requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)

      - name: Commit beat
        continue-on-error: true
        run: python scripts/commit_beat.py

      - name: Last 12 months
        continue-on-error: true
        run: python scripts/year_card.py

      - name: What I'm building and recent commits
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_tracker.py

      - name: Latest YouTube upload
        continue-on-error: true
        run: python scripts/youtube_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update profile cards"
          # other workflows (blog posts, activity) also commit to this branch, so retry on a race
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 10
          done
          exit 1
