# Profile cards and the contribution song.
# Cards: what I'm building, recent commits, latest YouTube upload, last 12 months, contribution song.
# The song MP3 and its player page are published to GitHub Pages (https://nishal21.github.io/nishal21/player/)
# instead of being committed, so the repo doesn't grow by 1.5 MB every night.
# Each generator runs on its own; if one fails, its previous image stays in place and Pages keeps the last song.
# Uses only the built-in GITHUB_TOKEN and public endpoints. No extra secrets.
# One-time setting: Settings > Pages > Build and deployment > Source: GitHub Actions.

name: Profile cards

on:
  schedule:
    - cron: "30 18 * * *"  # 00:00 IST every night
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "player/**"
      - "scripts/**"
      - ".github/workflows/profile-cards.yml"

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      song: ${{ steps.song.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          pip install --quiet -r scripts/requirements.txt
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)

      - name: Cache the Piper voice models
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper-voices
          key: piper-voices-ryan-high-lessac-high-v3

      - name: Last 12 months
        continue-on-error: true
        run: python scripts/year_card.py

      - name: All time
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/alltime_card.py

      - name: What I'm building and recent commits
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_tracker.py

      - name: Latest YouTube upload
        continue-on-error: true
        run: python scripts/youtube_card.py

      - name: Check the lyric templates
        continue-on-error: true
        run: python scripts/test_song_lyrics.py

      - name: Contribution song
        id: song
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/contribution_song.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update profile cards"
          # other workflows (blog posts, activity) also commit to this branch, so retry on a race
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Build the player site
        if: steps.song.outcome == 'success'
        run: bash scripts/build_site.sh

      - name: Upload the site
        if: steps.song.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    needs: cards
    if: needs.cards.outputs.song == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}player/
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
